# Staging only. Production deployment requires a separate reviewed configuration.
name = "2see-admin-staging"
main = "worker.js"
compatibility_date = "2026-10-01"
workers_dev = true
preview_urls = false
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
html_handling = "none"
not_found_handling = "none"
[vars]
GITHUB_REPO = "2seemedia/2seemedia.github.io"
GITHUB_BRANCH = "admin/content-staging"
PRODUCTION_BRANCH = "main"
PUBLISH_ENABLED = "false"
PRODUCTION_APPROVED = "false"
AUTH_MODE = "password"
# ADMIN_PASSWORD is a Worker Secret set by the owner; never add it here.
[[ratelimits]]
name = "LOGIN_LIMITER"
namespace_id = "22065101"
simple = { limit = 5, period = 60 }
[[ratelimits]]
name = "LOGIN_GLOBAL_LIMITER"
namespace_id = "22065102"
simple = { limit = 20, period = 60 }
