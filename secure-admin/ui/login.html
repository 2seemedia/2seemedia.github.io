<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>2SEE | دخول لوحة التحكم</title><style>
:root{color-scheme:dark;font-family:Tahoma,Arial,sans-serif;background:#101013;color:#f4f4f4}*{box-sizing:border-box}body{min-height:100dvh;margin:0;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 80% 0%,#4b142044,transparent 65%),#101013}main{width:min(100%,440px);border:1px solid #36363b;border-radius:22px;padding:38px;background:#1a1a1e;box-shadow:0 24px 80px #0005}.logo{font:900 48px Arial,sans-serif;letter-spacing:-3px;direction:ltr;text-align:center}.logo span{color:#c91524}h1{text-align:center;font-size:24px;margin:18px 0 10px}p{color:#aaaab3;line-height:1.8;font-size:14px;text-align:center;margin-bottom:24px}label{display:block;margin:18px 0 8px;font-size:14px}input,button{font:inherit;width:100%;border-radius:10px;padding:14px}input{background:#101013;border:1px solid #44444a;color:white;direction:ltr;text-align:left}input:focus{outline:2px solid #c91524;outline-offset:2px}button{margin-top:24px;border:0;background:#c91524;color:white;font-weight:bold;cursor:pointer}button:disabled{opacity:.5;cursor:wait}#status{min-height:44px;margin:16px 0 0;color:#ffbdc1;text-align:right}.foot{border-top:1px solid #36363b;padding-top:18px;margin:16px 0 0;font-size:12px}</style></head><body><main><div class="logo">2<span>SEE</span></div><h1>دخول لوحة التحكم</h1><p>إدارة محتوى 2SEE Media ومعاينة التعديلات.</p><form id="login-form"><label for="username">اسم الحساب</label><input id="username" name="username" autocomplete="username" value="2SEE" required maxlength="32"><label for="password">كلمة مرور اللوحة</label><input id="password" name="password" type="password" autocomplete="current-password" required maxlength="256"><button id="submit" type="submit">دخول</button><p id="status" role="status" aria-live="polite"></p></form><p class="foot">لوحة خاصة بإدارة 2SEE Media.</p></main><script src="/assets/js/login.js"></script></body></html>
